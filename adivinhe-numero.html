<!DOCTYPE html>
<html>

<head>
    <title>Adivinhe o Número</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app jogo">

        <h1>🎲 Adivinhe o Número</h1>

        <p>
            Estou pensando em um número de 1 a 5...
        </p>

        <input
            type="number"
            id="tentativa"
            min="1"
            max="5">

        <button id="jogar" class="botao-mochi">
            🎲 Tentar
        </button>

        <button id="voltar" class="botao-mochi">
            ⬅ Voltar
        </button>

    </div>

    <script src="js/adivinhe-numero.js"></script>

</body>

</html>
